<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOP1 SHOP - UID Name Check</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b16;color:#fff;min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:28px 16px}.card{background:#151527;border:1px solid #2b2945;border-radius:20px;padding:22px;box-shadow:0 16px 45px #0006}
h1{margin:0 0 8px;font-size:28px}p{color:#aaa8ba;line-height:1.5}.label{display:block;margin:20px 0 7px;font-weight:700}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #393650;background:#0e0e1b;color:#fff;font-size:16px;outline:none}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#9333ea);color:#fff;font-size:16px;font-weight:800}
button:disabled{opacity:.6}.result{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#0e0e1b;border:1px solid #393650}
.row{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid #252438}.row:last-child{border:0}.muted{color:#aaa8ba}.error{color:#ff8c8c}
.note{font-size:12px;margin-top:14px;color:#858296}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>TOP1 SHOP</h1>
<p>Free Fire UID দিয়ে Player Name Check</p>
<label class="label" for="uid">Player UID</label>
<input id="uid" inputmode="numeric" maxlength="15" placeholder="যেমন: 1234567890">
<label class="label" for="region">Region</label>
<select id="region"><option value="BD">Bangladesh (BD)</option><option value="IND">India (IND)</option><option value="SG">Singapore (SG)</option></select>
<button id="check">🔍 CHECK NAME</button>
<div id="result" class="result"></div>
<div class="note">API-based lookup. The external API is not an official Garena service and may be unavailable or change without notice.</div>
</div></div>
<script>
const uidEl=document.getElementById('uid'), regionEl=document.getElementById('region');
const btn=document.getElementById('check'), result=document.getElementById('result');
btn.onclick=async()=>{
 const uid=uidEl.value.trim(), region=regionEl.value;
 if(!/^\\d{5,15}$/.test(uid)){result.style.display='block';result.innerHTML='<div class="error">সঠিক Player UID দিন (5–15 digits)।</div>';return;}
 btn.disabled=true; btn.textContent='Checking...'; result.style.display='block'; result.innerHTML='Name check হচ্ছে...';
 try{
   const url=`https://free-ff-api-src-5plp.onrender.com/api/v1/account?region=${encodeURIComponent(region)}&uid=${encodeURIComponent(uid)}`;
   const r=await fetch(url,{headers:{Accept:'application/json'}});
   if(!r.ok) throw new Error('API unavailable');
   const data=await r.json();
   const b=data.basicInfo||data.basicinfo||data.data?.basicInfo||data.data?.basicinfo||{};
   const name=b.nickname||b.nickName||data.nickname||data.name;
   const level=b.level||b.Level||'—';
   if(!name) throw new Error('Player not found');
   result.innerHTML=`<div class="row"><span class="muted">Game Name</span><strong>${escapeHtml(String(name))}</strong></div>
   <div class="row"><span class="muted">UID</span><strong>${escapeHtml(uid)}</strong></div>
   <div class="row"><span class="muted">Level</span><strong>${escapeHtml(String(level))}</strong></div>`;
 }catch(e){
   result.innerHTML='<div class="error">Name পাওয়া যায়নি। UID/Region ঠিক আছে কি না দেখুন, অথবা API সাময়িকভাবে unavailable হতে পারে।</div>';
 }finally{btn.disabled=false;btn.textContent='🔍 CHECK NAME';}
};
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
</script>
</body>
</html>
