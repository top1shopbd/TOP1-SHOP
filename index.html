<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP1 SHOP</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --blue:#1768e8;
  --blue2:#123b8d;
  --red:#ef2939;
  --bg:#f5f7fb;
  --text:#182033;
  --muted:#8a92a1;
  --white:#fff;
  --border:#e3e6ec;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:100px;
}

button{
  font-family:inherit;
  cursor:pointer;
}

input{
  font-family:inherit;
}

/* ================= HEADER ================= */

.header{
  height:76px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 15px rgba(0,0,0,.06);
}

.logo{
  font-size:31px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-2px;
}

.logo-blue{
  color:var(--blue);
}

.logo-red{
  color:var(--red);
}

.header-right{
  display:flex;
  align-items:center;
  gap:13px;
}

.cart-btn{
  border:0;
  background:transparent;
  font-size:27px;
}

.login-btn{
  border:0;
  background:var(--blue);
  color:#fff;
  padding:14px 20px;
  border-radius:16px;
  font-size:16px;
  font-weight:bold;
}

/* ================= CONTAINER ================= */

.container{
  width:min(900px,94%);
  margin:auto;
}

/* ================= PAGES ================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* ================= HOME HERO ================= */

.hero{
  margin-top:20px;
  min-height:245px;
  border-radius:32px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(135deg,#eef4ff,#dce9ff);
  padding:32px;
  display:flex;
  align-items:center;
}

.hero-text{
  width:63%;
  position:relative;
  z-index:2;
}

.hero-text h1{
  color:var(--blue);
  font-size:34px;
  line-height:1.15;
}

.hero-text h1 span{
  color:var(--red);
}

.hero-text p{
  margin-top:14px;
  color:#4b5870;
  font-size:17px;
  line-height:1.5;
}

.hero-character{
  position:absolute;
  right:10px;
  bottom:0;
  width:39%;
  height:90%;
  display:flex;
  justify-content:center;
  align-items:end;
}

.character{
  width:145px;
  height:170px;
  border-radius:75px 75px 22px 22px;
  background:linear-gradient(145deg,#1596ff,#173d9d);
  position:relative;
  box-shadow:0 15px 35px rgba(20,65,160,.3);
}

.character:before{
  content:"";
  position:absolute;
  width:76px;
  height:76px;
  border-radius:50%;
  background:#ffd7bc;
  left:35px;
  top:-42px;
}

.character:after{
  content:"";
  position:absolute;
  width:90px;
  height:34px;
  border-radius:50% 50% 20% 20%;
  background:#12d4ff;
  left:28px;
  top:-49px;
  transform:rotate(-8deg);
}

/* ================= DOTS ================= */

.dots{
  text-align:center;
  margin:10px 0 16px;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  background:#c7ccd5;
  border-radius:50%;
  margin:3px;
}

.dot.active{
  background:var(--blue);
}

/* ================= QUICK ================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.quick{
  background:#fff;
  border-radius:20px;
  padding:16px 8px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.quick-icon{
  font-size:27px;
}

.quick small{
  display:block;
  color:#a0a6b0;
  margin-top:4px;
}

.quick b{
  font-size:14px;
}

/* ================= SPIN ================= */

.spin{
  margin-top:22px;
  background:#fff8df;
  border:1px solid #f2df9f;
  border-radius:23px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:15px;
}

.spin-icon{
  width:62px;
  height:62px;
  border-radius:19px;
  background:#ff9b00;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
}

.spin-text small{
  color:#e06d18;
  font-weight:bold;
}

.spin-text b{
  display:block;
  margin-top:5px;
  font-size:16px;
}

/* ================= SECTION ================= */

.section{
  margin-top:35px;
}

.section-title{
  font-size:27px;
  text-align:center;
  margin-bottom:19px;
}

/* ================= UID ================= */

.uid-card{
  background:#fff;
  border-radius:25px;
  padding:23px;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.uid-card label{
  display:block;
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
}

.uid-card input,
.form-input{
  width:100%;
  padding:17px;
  border:1px solid #dfe2e8;
  border-radius:16px;
  font-size:18px;
  outline:none;
}

.uid-card input:focus,
.form-input:focus{
  border-color:var(--blue);
}

.check-btn{
  width:100%;
  border:0;
  background:#182033;
  color:#fff;
  padding:17px;
  border-radius:16px;
  margin-top:12px;
  font-size:18px;
  font-weight:bold;
}

.result{
  display:none;
  margin-top:12px;
  padding:13px;
  border-radius:13px;
  font-weight:bold;
}

/* ================= PRODUCTS ================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.product{
  background:#fff;
  border:2px solid transparent;
  border-radius:21px;
  padding:20px 10px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
  transition:.15s;
}

.product:active{
  transform:scale(.97);
}

.product.selected{
  border-color:var(--blue);
  background:#edf5ff;
}

.product-icon{
  font-size:38px;
}

.product-name{
  min-height:42px;
  margin-top:7px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:16px;
  font-weight:bold;
}

.product-price{
  margin-top:8px;
  color:var(--blue);
  font-size:23px;
  font-weight:900;
}

/* ================= SUMMARY ================= */

.summary{
  background:#fff;
  border-radius:25px;
  padding:23px;
  margin-top:22px;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.summary h3{
  margin-bottom:13px;
}

.summary-info{
  line-height:1.8;
  color:#424b5d;
}

.order-btn,
.primary-btn{
  width:100%;
  border:0;
  background:var(--blue);
  color:#fff;
  padding:17px;
  border-radius:17px;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

/* ================= BLUE HERO PAGES ================= */

.page-hero{
  margin-top:20px;
  background:linear-gradient(135deg,#2c57ae,#12357e);
  color:#fff;
  border-radius:32px;
  padding:34px;
  box-shadow:0 15px 35px rgba(20,65,150,.2);
}

.page-badge{
  display:inline-block;
  background:rgba(255,255,255,.13);
  padding:10px 15px;
  border-radius:20px;
  font-weight:bold;
  letter-spacing:1px;
}

.page-hero h1{
  font-size:34px;
  margin-top:18px;
}

.page-hero p{
  margin-top:12px;
  color:#dce7ff;
  font-size:17px;
  line-height:1.6;
}

/* ================= ORDERS ================= */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:22px;
}

.stat{
  background:rgba(255,255,255,.1);
  padding:17px;
  border-radius:20px;
  text-align:center;
}

.stat small{
  color:#dce7ff;
}

.stat b{
  display:block;
  font-size:24px;
  margin-top:4px;
}

.order-search{
  background:#fff;
  margin-top:22px;
  padding:22px;
  border-radius:25px;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.order-search h3{
  margin-bottom:14px;
}

.order-item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin-top:12px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
}

/* ================= ADD MONEY ================= */

.money-card{
  background:#fff;
  border-radius:25px;
  padding:24px;
  margin-top:22px;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.balance-big{
  background:linear-gradient(135deg,#2453ad,#1769e8);
  color:#fff;
  border-radius:22px;
  padding:23px;
}

.balance-big small{
  color:#dce7ff;
}

.balance-big b{
  display:block;
  font-size:34px;
  margin-top:5px;
}

.payment-title{
  margin:23px 0 12px;
  font-size:19px;
  font-weight:bold;
}

.payment-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.payment{
  border:2px solid var(--border);
  padding:18px;
  border-radius:17px;
  text-align:center;
  font-weight:bold;
}

.payment.active{
  border-color:var(--blue);
  background:#edf5ff;
}

/* ================= SUPPORT ================= */

.support-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:22px;
}

.support-card{
  background:#fff;
  border-radius:24px;
  padding:23px;
  min-height:205px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.support-icon{
  font-size:42px;
}

.support-card h3{
  margin-top:15px;
  font-size:20px;
}

.support-card p{
  color:#9299a5;
